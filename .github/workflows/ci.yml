name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Compile
        run: python -m compileall -q src tests scripts evals
      - name: Raw key scan
        run: python scripts/scan_for_raw_keys.py .

  standard-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify packaged engine metadata
        run: python scripts/doctor.py --static
      - name: Bootstrap isolated runtime
        run: python scripts/bootstrap_runtime.py
      - name: Verify packaged engine and runtime
        run: python scripts/doctor.py --deep
      - name: Verify portable governance reports
        run: python scripts/normalize_governance_reports.py --check
      - name: Build standard Skill archive
        run: python scripts/build_skill_store_package.py
      - name: Verify extracted Skill archive
        run: |
          rm -rf /tmp/exam-revision-handbook-install
          mkdir -p /tmp/exam-revision-handbook-install
          unzip -q dist/exam-revision-handbook-v*.zip -d /tmp/exam-revision-handbook-install
          cd /tmp/exam-revision-handbook-install/exam-revision-handbook
          python scripts/doctor.py --deep
          python scripts/run_runtime.py -- --help
          python scripts/import_concept_explanations.py --help
          python scripts/import_infographic_assets.py --help
      - name: Probe packaged runtime
        run: python scripts/run_runtime.py -- --help
      - name: Probe import helpers
        run: |
          python scripts/import_concept_explanations.py --help
          python scripts/import_infographic_assets.py --help
