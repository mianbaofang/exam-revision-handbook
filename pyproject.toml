[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-revision-handbook"
version = "0.7.1"
description = "Generate source-backed GCSE, IGCSE, A-Level, and AP revision handbooks with reviewed visuals and PDF output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ethan" }]
dependencies = [
  "pypdf>=4.0",
]

[project.optional-dependencies]
pdf = ["playwright>=1.45"]
audit = ["beautifulsoup4>=4.12", "requests>=2.31"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5,<0.16",
  "mypy>=1.10",
  "openai>=1.30",
  "PyYAML>=6.0",
  "tenacity>=8.2",
]

[project.scripts]
intl-exam-guide = "intl_exam_guide.cli:main"
igcse-a-level-guide = "intl_exam_guide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intl_exam_guide = ["assets/*.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/intl_exam_guide"]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["intl_exam_guide"]

[tool.coverage.report]
show_missing = true
skip_covered = true
